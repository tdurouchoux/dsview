    "obsidiantools>=0.10.0",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.3",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "scikit-learn>=1.6.0",
    "sqlmodel>=0.0.22",
