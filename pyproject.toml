[project]
name = "dsview"
version = "1.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thibaultdu", email = "39222414+thibaultdu@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "levenshtein>=0.26.1",
    "mlflow>=2.19.0",
    "numpy>=1.26.4",
    "obsidiantools>=0.10.0",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.3",
    "pypdf>=5.1.0",
    "python-dotenv>=1.0.1",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "scikit-learn>=1.6.0",
    "sqlmodel>=0.0.22",
    "streamlit>=1.41.1",
    "tiktoken>=0.8.0",
    "typer>=0.15.1",
    "rouge>=1.0.1",
    "scipy>=1.14.1",
    "nltk>=3.9.1",
    "instructor[anthropic]>=1.7.2",
    "pytest>=8.3.4",
    "ollama>=0.4.7",
    "openai>=1.63.0",
    "anthropic>=0.42.0",
    "mistralai>=1.5.0",
    "tenacity>=9.0.0",
    "altair>=5.5.0",
    "marimo>=0.13.11",
    "dayplot>=0.3.3",
    "networkx>=3.4.2",
    "numba>=0.61.2",
    "umap-learn>=0.5.9.post2",
    "psycopg[binary]>=3.2.9",
    "duckdb>=1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dsview = "dsview.cli:main"
dsview-ui = "dsview.interface.run_dashboard:main"

[dependency-groups]
dev = [
    "nest-asyncio>=1.6.0",
    "python-lsp-server>=1.12.2",
    "wat>=0.5.1",
]
