[project]
name = "dsview"
version = "2.6.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thibaultdu", email = "39222414+thibaultdu@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.3",
    "python-dotenv>=1.0.1",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "sqlmodel>=0.0.22",
    "tiktoken>=0.8.0",
    "typer>=0.15.1",
    "instructor[anthropic]>1.15",
    "ollama>=0.4.7",
    "openai>=1.63.0",
    "anthropic>=0.42.0",
    "mistralai>=2.6,<3",
    "tenacity>=9.0.0",
    "psycopg[binary]>=3.2.9",
    "duckdb>=1.3.2",
    "beautifulsoup4>=4.13.5",
    "igraph>=1.0.0",
    "markdown-it-py>=3.0.0",
    "logfire[fastapi,requests,sqlalchemy]>=4.40.0",
    "openinference-instrumentation-mistralai>=2.0",
    "youtube-transcript-api>=1.2.4",
    "jinja2>=3.1.6",
]

[tool.uv]
# Keep numba modern: without this, a too-new numpy makes uv backtrack to
# numba 0.53 / llvmlite 0.36, which no longer builds.
constraint-dependencies = ["numba>=0.60"]
# "dev" is uv's own implicit default; listed explicitly here because adding
# "evaluation" means we must give the full list. Keeps `uv sync` (no --group)
# covering local dev + `dsview evaluate` as before, while the 4 Dockerfiles
# opt out with --no-default-groups and pull in only what each image needs.
default-groups = ["dev", "evaluation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dsview = "dsview.cli:main"
dsview-ui = "dsview.interface.run_dashboard:main"


[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "nest-asyncio>=1.6.0",
    "wat>=0.5.1",
]
# Only dsview/evaluation/* imports these - metric libraries for the `dsview evaluate`
# CLI (mlflow tracking, ROUGE/BLEU-style scoring, sklearn clustering for entity
# resolution). None of the 4 service Dockerfiles need this group.
evaluation = [
    "mlflow[genai]>=3.10.1",
    "rouge>=1.0.1",
    "scipy>=1.14.1",
    "nltk>=3.9.1",
    "scikit-learn>=1.6.0",
]
dashboard = [
    "marimo>=0.23.14",
    "altair>=5.5.0",
    "dayplot>=0.3.3",
    "networkx>=3.4.2",
    "umap-learn>=0.5.9.post2",
]
labels = [
    "streamlit>=1.41.1",
]
api = [
    "docling>=2.113.0",
    "fastapi[standard]>=0.139.0",
]
mcp = [
    "mcp>=1.27.0",
    "fastapi[standard]>=0.115.6",
]


[tool.ruff]
required-version = ">=0.16.4"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
ignore = ["B008", "B018", "RUF012"]
