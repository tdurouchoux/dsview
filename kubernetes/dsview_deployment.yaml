---
# ConfigMap for common environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsview-config
data:
  POSTGRES_HOST: "dsview-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "defaultdb"
  POSTGRES_USER: "postgres"

---
# PersistentVolumeClaim for PostgreSQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsview-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Uncomment and specify storageClassName if needed
  # storageClassName: standard

---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsview-postgres
  labels:
    app: dsview
    component: postgres
spec:
  serviceName: dsview-postgres
  replicas: 1
  selector:
    matchLabels:
      app: dsview
      component: postgres
  template:
    metadata:
      labels:
        app: dsview
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - dsview
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - dsview
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: dsview-postgres-pvc

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: dsview-postgres
  labels:
    app: dsview
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: dsview
    component: postgres

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: dsview-api-service
  labels:
    app: dsview
    component: api
spec:
  selector:
    app: dsview
    component: api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: dsview-dashboard-service
  labels:
    app: dsview
    component: dashboard
spec:
  selector:
    app: dsview
    component: dashboard
  ports:
    - name: http
      protocol: TCP
      port: 2718
      targetPort: 2718
  type: ClusterIP

---
# Labels Service
apiVersion: v1
kind: Service
metadata:
  name: dsview-labels-service
  labels:
    app: dsview
    component: labels
spec:
  selector:
    app: dsview
    component: labels
  ports:
    - name: http
      protocol: TCP
      port: 8501
      targetPort: 8501
  type: ClusterIP

---
# API Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsview-ingest-ingress
  namespace: user-tdurouchoux
  labels:
    app: dsview
    component: api
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth-dsview-ingest
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: dsview-ingest.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsview-api-service
                port:
                  number: 8000
  tls:
    - hosts:
        - dsview-ingest.lab.sspcloud.fr

---
# Dashboard Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsview-dashboard-ingress
  namespace: user-tdurouchoux
  labels:
    app: dsview
    component: dashboard
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth-dsview-dashboard
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: dsview-dashboard.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsview-dashboard-service
                port:
                  number: 2718
  tls:
    - hosts:
        - dsview-dashboard.lab.sspcloud.fr

---
# Labels Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsview-labels-ingress
  namespace: user-tdurouchoux
  labels:
    app: dsview
    component: labels
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth-dsview-dashboard
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: dsview-labels.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsview-labels-service
                port:
                  number: 8501
  tls:
    - hosts:
        - dsview-labels.lab.sspcloud.fr

---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsview-api
  labels:
    app: dsview
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsview
      component: api
  template:
    metadata:
      labels:
        app: dsview
        component: api
    spec:
      serviceAccountName: dsview-sa
      containers:
        - name: dsview-api
          image: ghcr.io/tdurouchoux/dsview-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "1000Mi"
              cpu: "1000m"
            limits:
              memory: "8000Mi"
              cpu: "4000m"
          env:
            # From ConfigMap
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_USER
            # From Secrets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_PASSWORD
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: MISTRAL_API_KEY
            - name: VAULT_REPOSITORY
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: VAULT_REPOSITORY
            - name: GITHUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: GITHUB_USERNAME
            - name: GITHUB_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: GITHUB_USER_EMAIL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: GITHUB_TOKEN

---
# Dashboard Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsview-dashboard
  labels:
    app: dsview
    component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsview
      component: dashboard
  template:
    metadata:
      labels:
        app: dsview
        component: dashboard
    spec:
      serviceAccountName: dsview-sa
      containers:
        - name: dsview-dashboard
          image: ghcr.io/tdurouchoux/dsview-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2718
              name: http
          resources:
            requests:
              memory: "500Mi"
              cpu: "500m"
            limits:
              memory: "4000Mi"
              cpu: "2000m"
          env:
            # From ConfigMap
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_USER
            # From Secrets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_PASSWORD
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: MISTRAL_API_KEY

---
# Labels Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsview-labels
  labels:
    app: dsview
    component: labels
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsview
      component: labels
  template:
    metadata:
      labels:
        app: dsview
        component: labels
    spec:
      serviceAccountName: dsview-sa
      containers:
        - name: dsview-labels
          image: ghcr.io/tdurouchoux/dsview-labels:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
              name: http
          resources:
            requests:
              memory: "500Mi"
              cpu: "500m"
            limits:
              memory: "4000Mi"
              cpu: "2000m"
          # Uncomment health probes if needed
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTP
            timeoutSeconds: 1
            initialDelaySeconds: 30
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTP
            timeoutSeconds: 1
            initialDelaySeconds: 10
          env:
            # From ConfigMap
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: dsview-config
                  key: POSTGRES_USER
            # From Secrets
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_PASSWORD
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: MISTRAL_API_KEY
