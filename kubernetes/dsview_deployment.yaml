apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsview-deployment
  labels:
    app: dsview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsview
  template:
    metadata:
      labels:
        app: dsview
    spec:
      serviceAccountName: dsview-sa
      containers:
        - name: dsview-api
          image: ghcr.io/tdurouchoux/dsview-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
            # - containerPort: 8501
            # - containerPort: 2718
          resources:
            requests:
              memory: "1000Mi"
              cpu: "1000m"
            limits:
              memory: "8000Mi"
              cpu: "4000m"
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: MISTRAL_API_KEY
            - name: VAULT_REPOSITORY
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: VAULT_REPOSITORY
            - name: GITHUB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: GITHUB_USERNAME
            - name: GITHUB_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: GITHUB_USER_EMAIL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: GITHUB_TOKEN
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_PASSWORD
        - name: dsview-dashboard
          image: ghcr.io/tdurouchoux/dsview-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2718
          resources:
            requests:
              memory: "500Mi"
              cpu: "500m"
            limits:
              memory: "4000Mi"
              cpu: "2000m"
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_PASSWORD
        - name: dsview-labels
          image: ghcr.io/tdurouchoux/dsview-labels:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "500Mi"
              cpu: "500m"
            limits:
              memory: "4000Mi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTP
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTP
            timeoutSeconds: 1
          env:
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: MISTRAL_API_KEY
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_HOST
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsview-secret
                  key: POSTGRES_PASSWORD