---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: dsview-api-service
  labels:
    app: dsview
    component: api
spec:
  selector:
    app: dsview
    component: api
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: dsview-dashboard-service
  labels:
    app: dsview
    component: dashboard
spec:
  selector:
    app: dsview
    component: dashboard
  ports:
    - name: http
      protocol: TCP
      port: 2718
      targetPort: 2718
  type: ClusterIP

---
# Labels Service
apiVersion: v1
kind: Service
metadata:
  name: dsview-labels-service
  labels:
    app: dsview
    component: labels
spec:
  selector:
    app: dsview
    component: labels
  ports:
    - name: http
      protocol: TCP
      port: 8501
      targetPort: 8501
  type: ClusterIP

---
# API Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsview-ingest-ingress
  namespace: user-tdurouchoux
  labels:
    app: dsview
    component: api
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth-dsview-ingest
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: dsview-ingest.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsview-api-service
                port:
                  number: 8000
  tls:
    - hosts:
        - dsview-ingest.lab.sspcloud.fr

---
# Dashboard Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsview-dashboard-ingress
  namespace: user-tdurouchoux
  labels:
    app: dsview
    component: dashboard
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth-dsview-dashboard
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: dsview-dashboard.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsview-dashboard-service
                port:
                  number: 2718
  tls:
    - hosts:
        - dsview-dashboard.lab.sspcloud.fr

---
# Labels Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsview-labels-ingress
  namespace: user-tdurouchoux
  labels:
    app: dsview
    component: labels
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth-dsview-dashboard
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: dsview-labels.lab.sspcloud.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsview-labels-service
                port:
                  number: 8501
  tls:
    - hosts:
        - dsview-labels.lab.sspcloud.fr
